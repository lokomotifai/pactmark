name: Fuzz

on:
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jazzer-smoke:
    name: Jazzer.js security boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - name: Install the pinned package manager
        run: npm install --global pnpm@11.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build fuzz targets
        run: pnpm build
      - name: Fuzz canonical JSON
        run: pnpm fuzz:canonical-json
      - name: Fuzz policy URL normalization
        run: pnpm fuzz:policy-url
      - name: Fuzz initializer target validation
        run: pnpm fuzz:initializer-target
