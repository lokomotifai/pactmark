name: Security baseline

on:
  pull_request:
  schedule:
    - cron: "17 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-security:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.18.0
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Bootstrap digest-pinned sandbox base image
        run: pnpm bootstrap:sandbox-container-base
      - name: Bootstrap digest-pinned Executor self-host image
        run: pnpm bootstrap:executor-sh-image
      - name: Build workspace packages
        run: pnpm build
      - name: Run deterministic security gate
        run: pnpm security:verify
