name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact coordinated package version to release
        required: true
        type: string
      confirmation:
        description: Type publish-pactmark-<version> to build, attest, and publish the release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-candidate:
    name: Build and freeze v${{ inputs.version }} candidate
    if: >-
      github.repository == 'lokomotifai/pactmark' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == format('publish-pactmark-{0}', inputs.version)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          package-manager-cache: false
      # pnpm/setup v2.0.2
      - name: Install pinned pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          version: 11.18.0
          install: false
      - name: Verify the npm bundled with pinned Node.js
        run: test "$(npm --version)" = "11.16.0"
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Verify requested version against package metadata
        run: pnpm release:version:check "$PACTMARK_RELEASE_VERSION"
        env:
          PACTMARK_RELEASE_VERSION: ${{ inputs.version }}
      - name: Bootstrap digest-pinned sandbox base image
        run: pnpm bootstrap:sandbox-container-base
      - name: Bootstrap digest-pinned Executor self-host image
        run: pnpm bootstrap:executor-sh-image
      - name: Run canonical deterministic gate
        run: pnpm verify
      - name: Run current network freshness gates
        run: |
          pnpm audit:dependencies:live
          pnpm docs:external-links:live
      - name: Build exact release artifacts from the approved source
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" pnpm release:dry-run
          pnpm release:candidate:finalize
        env:
          PACTMARK_RELEASE_ENVIRONMENT: release
          PACTMARK_RELEASE_RUNNER: github-hosted
      - name: Verify exact candidate checksums
        working-directory: .artifacts/release-dry-run
        run: sha256sum --check SHA256SUMS
      - name: Upload immutable release candidate
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pactmark-v${{ inputs.version }}-release-${{ github.sha }}
          path: .artifacts/release-dry-run
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

  publish:
    name: Attest and publish frozen v${{ inputs.version }} candidate
    needs: build-candidate
    if: >-
      github.repository == 'lokomotifai/pactmark' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == format('publish-pactmark-{0}', inputs.version)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          package-manager-cache: false
      # pnpm/setup v2.0.2
      - name: Install pinned pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          version: 11.18.0
          install: false
      - name: Verify the npm bundled with pinned Node.js
        run: test "$(npm --version)" = "11.16.0"
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download candidate built by the unprivileged job
        # actions/download-artifact v6
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pactmark-v${{ inputs.version }}-release-${{ github.sha }}
          path: .artifacts/release-dry-run
      - name: Verify downloaded candidate checksums
        working-directory: .artifacts/release-dry-run
        run: sha256sum --check SHA256SUMS
      - name: Generate GitHub build provenance
        id: provenance
        # actions/attest v4
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: .artifacts/release-dry-run/SHA256SUMS
      - name: Generate GitHub SBOM attestation
        id: sbom
        # actions/attest v4
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: .artifacts/release-dry-run/tarballs/*.tgz
          sbom-path: .artifacts/release-dry-run/pactmark-release.cdx.json
      - name: Retain attestation bundles beside the frozen artifacts
        run: |
          mkdir -p .artifacts/release-dry-run/attestations
          cp "$PROVENANCE_BUNDLE" .artifacts/release-dry-run/attestations/provenance.jsonl
          cp "$SBOM_BUNDLE" .artifacts/release-dry-run/attestations/sbom.jsonl
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
      - name: Prepare source-bound OIDC publication authorization
        run: >-
          node --import tsx tooling/prepare-oidc-publication.mts
          .artifacts/release-dry-run
          .artifacts/release-dry-run/oidc-publication-config.json
      - name: Publish exact tarballs through npm trusted publishing
        run: >-
          node --import tsx tooling/release-publish.mts
          --config .artifacts/release-dry-run/oidc-publication-config.json
          --authorize-public-release "$PACTMARK_RELEASE_CONFIRMATION"
        env:
          PACTMARK_RELEASE_ENVIRONMENT: release
          PACTMARK_RELEASE_RUNNER: github-hosted
          PACTMARK_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
      - name: Upload attestation bundles
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pactmark-v${{ inputs.version }}-attestations-${{ github.sha }}
          path: .artifacts/release-dry-run/attestations
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
