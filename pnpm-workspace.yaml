packages:
  - "apps/*"
  - "examples/*"
  - "packages/*"
  - "fixtures/*"

strictDepBuilds: true
trustLockfile: true
verifyDepsBeforeRun: error
enableGlobalVirtualStore: false
dedupeInjectedDeps: false
overrides:
  "fast-uri@<3.1.6": "3.1.6" # MCP schema-validation owner: maintainers; patched URI parser release within fast-uri 3.x.
  "hono@<4.12.34": "4.12.34" # MCP HTTP owner: maintainers; patched CORS ReDoS within Hono 4.12.
  "nanoid@<3.3.18": "3.3.18" # Build/docs owner: maintainers; patched zero-size custom-generator loop within Nano ID 3.x.
  "postcss@8.4.31": "8.5.25" # Next build owner: maintainers; security backport within PostCSS 8.
  "sharp@0.34.5": "0.35.3" # Next build owner: maintainers; patched Node-API-compatible release.
  "undici@<7.29.0": "7.29.0" # Cloudflare preview owner: maintainers; patched disclosure/injection releases within Undici 7.
allowBuilds:
  bun: true # Compatibility-matrix owner: maintainers; reviewed installer selects the exact platform binary package.
  "esbuild@0.27.0": true # Next.js tooling owner: maintainers; reviewed installer validates the exact platform binary.
  "esbuild@0.28.1": true # Build tooling owner: maintainers; required by tsx, reviewed in lockfile.
  "sharp@0.35.3": true # Next.js image tooling owner: maintainers; reviewed install check uses the pinned optional platform binary.
  "workerd@1.20260730.1": true # Cloudflare preview owner: maintainers; reviewed installer validates the pinned optional platform binary.

minimumReleaseAgeExclude:
  - dependency-cruiser@18.1.1
  - tsx@4.23.5
  - verdaccio@6.9.2 # Candidate-registry owner: maintainers; exact current stable release verified before local-only use.
