<svg width="1600" height="940" viewBox="0 0 1600 940" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Pactmark governed run lifecycle</title>
  <desc id="desc">A validated WorkOrder becomes an admitted run. The runtime records planning, policy, tool effects and verification as events. Unknown authority fails closed; interruption resumes from durable run truth rather than repeating an uncertain effect.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7B8088"/></marker>
    <marker id="red-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#D11F26"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#17191F" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1600" height="940" rx="36" fill="#17191F"/>
  <rect x="36" y="36" width="1528" height="868" rx="28" fill="#1E2127" stroke="#3C4048" stroke-width="2"/>
  <rect x="88" y="78" width="46" height="46" fill="#D11F26"/>
  <path d="M104 94H113C123 94 128 99 128 107C128 115 122 120 113 120H109V111H113C117 111 119 109 119 106C119 103 117 101 113 101H109V120H104V94Z" fill="white"/>
  <path d="M112 116L117 111L122 116L130 108L135 113L122 126L112 116Z" fill="white"/>
  <text x="154" y="105" fill="#E6E8EB" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" letter-spacing="2">A GOVERNED RUN, END TO END</text>
  <text x="88" y="172" fill="white" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="50" font-weight="760">Success is a verified terminal state.</text>
  <text x="88" y="216" fill="#AEB3BB" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23">Not a plausible answer, not an HTTP 200, and not a model saying “done.”</text>

  <line x1="170" y1="368" x2="1425" y2="368" stroke="#555B65" stroke-width="4"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g>
      <circle cx="170" cy="368" r="32" fill="#D11F26" stroke="#FF7A7E" stroke-width="3"/>
      <text x="170" y="376" text-anchor="middle" fill="white" font-size="22" font-weight="800">1</text>
      <text x="170" y="431" text-anchor="middle" fill="white" font-size="21" font-weight="720">WorkOrder</text>
      <text x="170" y="461" text-anchor="middle" fill="#AEB3BB" font-size="16">goal · input · budget</text>
      <text x="170" y="485" text-anchor="middle" fill="#AEB3BB" font-size="16">purpose · authority</text>
    </g>
    <g>
      <circle cx="420" cy="368" r="32" fill="#2A2E35" stroke="#8A909A" stroke-width="3"/>
      <text x="420" y="376" text-anchor="middle" fill="white" font-size="22" font-weight="800">2</text>
      <text x="420" y="431" text-anchor="middle" fill="white" font-size="21" font-weight="720">Admission</text>
      <text x="420" y="461" text-anchor="middle" fill="#AEB3BB" font-size="16">schema · tenant</text>
      <text x="420" y="485" text-anchor="middle" fill="#AEB3BB" font-size="16">runtime capability</text>
    </g>
    <g>
      <circle cx="670" cy="368" r="32" fill="#2A2E35" stroke="#8A909A" stroke-width="3"/>
      <text x="670" y="376" text-anchor="middle" fill="white" font-size="22" font-weight="800">3</text>
      <text x="670" y="431" text-anchor="middle" fill="white" font-size="21" font-weight="720">Bounded work</text>
      <text x="670" y="461" text-anchor="middle" fill="#AEB3BB" font-size="16">model proposes</text>
      <text x="670" y="485" text-anchor="middle" fill="#AEB3BB" font-size="16">policy governs tools</text>
    </g>
    <g>
      <circle cx="920" cy="368" r="32" fill="#2A2E35" stroke="#8A909A" stroke-width="3"/>
      <text x="920" y="376" text-anchor="middle" fill="white" font-size="22" font-weight="800">4</text>
      <text x="920" y="431" text-anchor="middle" fill="white" font-size="21" font-weight="720">Artifact</text>
      <text x="920" y="461" text-anchor="middle" fill="#AEB3BB" font-size="16">content-addressed</text>
      <text x="920" y="485" text-anchor="middle" fill="#AEB3BB" font-size="16">typed output</text>
    </g>
    <g>
      <circle cx="1170" cy="368" r="32" fill="#2A2E35" stroke="#8A909A" stroke-width="3"/>
      <text x="1170" y="376" text-anchor="middle" fill="white" font-size="22" font-weight="800">5</text>
      <text x="1170" y="431" text-anchor="middle" fill="white" font-size="21" font-weight="720">Verification</text>
      <text x="1170" y="461" text-anchor="middle" fill="#AEB3BB" font-size="16">declared verifier</text>
      <text x="1170" y="485" text-anchor="middle" fill="#AEB3BB" font-size="16">pass · fail · unknown</text>
    </g>
    <g>
      <circle cx="1420" cy="368" r="32" fill="#D11F26" stroke="#FF7A7E" stroke-width="3"/>
      <path d="M1406 368L1416 378L1435 357" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1420" y="431" text-anchor="middle" fill="white" font-size="21" font-weight="720">EvidenceRecord</text>
      <text x="1420" y="461" text-anchor="middle" fill="#AEB3BB" font-size="16">bounded claim</text>
      <text x="1420" y="485" text-anchor="middle" fill="#AEB3BB" font-size="16">linked to run truth</text>
    </g>
  </g>

  <rect x="88" y="550" width="950" height="216" rx="24" fill="#F7F6F4" filter="url(#shadow)"/>
  <text x="120" y="594" fill="#626872" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="750" letter-spacing="1.5">APPEND-ONLY EVENT HISTORY</text>
  <line x1="128" y1="646" x2="992" y2="646" stroke="#D6D1CD" stroke-width="3"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
    <circle cx="144" cy="646" r="9" fill="#D11F26"/><text x="128" y="688" fill="#41464E">RunAccepted</text>
    <circle cx="340" cy="646" r="9" fill="#7B8088"/><text x="282" y="688" fill="#41464E">ToolCallProposed</text>
    <circle cx="568" cy="646" r="9" fill="#7B8088"/><text x="500" y="688" fill="#41464E">EffectAcknowledged</text>
    <circle cx="798" cy="646" r="9" fill="#7B8088"/><text x="742" y="688" fill="#41464E">ArtifactCreated</text>
    <circle cx="986" cy="646" r="9" fill="#D11F26"/><text x="926" y="688" fill="#41464E">RunCompleted</text>
  </g>
  <text x="120" y="737" fill="#626872" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Projections can be rebuilt. Hidden chain-of-thought is not run truth.</text>

  <rect x="1080" y="550" width="432" height="216" rx="24" fill="#2A2022" stroke="#7D3034" stroke-width="2"/>
  <text x="1112" y="594" fill="#FFB3B5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="750" letter-spacing="1.5">FAIL CLOSED</text>
  <text x="1112" y="636" fill="white" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="720">Unknown is not “allow.”</text>
  <text x="1112" y="674" fill="#D8BFC1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Missing scope, approval, metadata,</text>
  <text x="1112" y="700" fill="#D8BFC1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">runtime support or verifier result</text>
  <text x="1112" y="735" fill="#FF777B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">→ stable KAF_* denial</text>

  <path d="M670 516V819H1170V786" stroke="#8A909A" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#arrow)"/>
  <rect x="430" y="798" width="482" height="66" rx="18" fill="#272B31" stroke="#565C66"/>
  <text x="671" y="825" text-anchor="middle" fill="#FFB3B5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="750" letter-spacing="1.1">INTERRUPTION OR CRASH</text>
  <text x="671" y="849" text-anchor="middle" fill="#D7DADE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">resume from recorded state · reconcile uncertain effects</text>
  <text x="1480" y="850" text-anchor="end" fill="#7F858E" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">tested strategies, not a universal exactly-once claim</text>
</svg>
